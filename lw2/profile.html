<!DOCTYPE html>
<html>
    <head>
        <title>Profile</title>
        <meta charset="utf-8">
        <link href="src_profile/style.css" rel="stylesheet">
        </style>
    </head>
    <body class="block">
        <div class="back">
            <img src="src_profile/images/Home_page.png" alt="Home page" class="icons" style="margin-top: 32px;">
            <div>
                <img src="src_profile/images/Profile.png" alt="Profile" class="icons">
                <img src="src_profile/images/dot (1).png" alt="Dot" class="icons dot" style="margin-top: 45px;">
            </div>
            <img src="src_profile/images/Plus.png" alt="Add" class="icons">
       </div>
       <div class="headband">
            <h1 class="header"></h1>
       </div>
       <div class="profile_info">
            <img src="src_profile/images/vany.png" class="profile pic">
            <h2 class="profile name">Ваня Денисов</h2>
            <p class="profile description">Привет! Я системный аналитик в ACME :) Тут моя жизнь только для самых классных!</p>
            <div class="profile pic_counter">
                <img src="src_profile/images/pic_icon.png" alt="Picture icon" class="profile pic_counter icon">
                <p class="profile pic_counter text">43 поста</p>
            </div>
            <div class="profile content">
                <img src="src_profile/images/bag.png" alt="Bag" class="profile photos">
                <img src="src_profile/images/block_3.png" alt="Block" class="profile photos">
                <img src="src_profile/images/book.png" alt="Book" class="profile photos">
            </div>
            <div class="profile content">
                <img src="src_profile/images/cake.png" alt="Cake" class="profile photos">
                <img src="src_profile/images/cola.png" alt="Cola" class="profile photos">
                <img src="src_profile/images/friends.png" alt="Friends" class="profile photos">
            </div>
            <div class="profile content">
                <img src="src_profile/images/party.png" alt="Party" class="profile photos">
                <img src="src_profile/images/street.png" alt="Street" class="profile photos">
                <img src="src_profile/images/table.png" alt="Table" class="profile photos">
            </div>     
       </div>
    </body>
</html>
