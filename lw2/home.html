<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src_home/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="left-menu">
        <div class="menu-item">
            <img class="icon" src="src_home/images/home.png" width="" height="" alt="home">
        </div>
        <div class="menu-item">
            <img class="icon" src="src_home/images/User.png" alt="user">
        </div>
        <div class="menu-item">
            <img class="icon" src="src_home/images/Plus.png" alt="plus"> 
        </div>
    </div>

    <div class="content">
        <div class="post-card">
            <div class="post-header">
                <img src="src_home/images/vany.png" alt="Аватар Вани" class="avatar">
                <div class="author-name">Ваня Денисов</div>
            </div>

            <div class="media-container">
                <img src="src_home/images/winter.png" alt="Зимнее фото" class="post-image">
                <span class="image-counter"> 1/3</span>
                <img src='src_home/images/Slider Button.svg' class="slider-button">
                <img src='src_home/images/Slider Button.svg' class="slider-button-left">
            </div>

            <div class="likes-row">
                <img src="src_home/images/heart.png" class="heart">
                <span>203</span>
            </div>

            <div class="post-text">
                <p>
                    Так красиво сегодня на улице! Настоящая зима)) Вспоминается
                    Бродский: «Поздно ночью, в уснувшей долине, на самом дне, в гор…
                </p>
                <a href="#" class="more-link">ещё</a>
            </div>

            <div class="timestamp">2 часа назад</div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <img src="src_home/images/liza.png" alt="Аватар Лизы" class="avatar">
                <div class="author-name">Лиза Дёмина</div>
            </div>

            <div class="media-container">
                <img src="src_home/images/fish.jpg" alt="Фото Лизы" class="post-image">
            </div>
        </div>
    </div>
</body>
</html>>
