<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <meta charset="utf-8">
    </head>
    <body>
        <form action="lucky.php" method="post">
            <div>
                <label for="number-first"></label>
                <input type="text" name="number-first" pattern="\d{6}" required 
                placeholder="Введите первый номер" class="input">
            </div>
            <div>
                <label for="number-second"></label>
                <input type="text" name="number-second" pattern="\d{6}" required 
                placeholder="Введите второй номер" class="input">
            </div>
            <button class="button">Вывести</button>
    </body>
</html>
